name: Audit Cask

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check updater syntax and release metadata
        run: |
          ruby -c Scripts/update-agentmicro-cask.rb
          ruby Scripts/update-agentmicro-cask.rb --check

      - name: Audit Cask
        run: brew audit --new --cask Casks/agentmicro.rb
